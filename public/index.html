<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud CRM & Document Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <!-- LAYAR LOGIN PIN -->
    <div id="login-view" class="min-h-screen flex items-center justify-center bg-gray-100">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm text-center">
            <h2 class="text-2xl font-bold mb-6 text-blue-600">Login CRM</h2>
            <input type="password" id="pin-input" placeholder="Masukkan PIN Akses" class="w-full px-4 py-3 border rounded-lg mb-4 text-center focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700">Masuk</button>
            <p id="login-error" class="text-red-500 text-sm mt-4 hidden">PIN minimal 4 karakter!</p>
        </div>
    </div>

    <!-- LAYAR DASHBOARD -->
    <div id="dashboard-view" class="hidden min-h-screen flex-col">
        <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md">
            <h1 class="text-xl font-bold">Cloud CRM Dashboard</h1>
            <button onclick="handleLogout()" class="bg-blue-800 px-4 py-2 rounded text-sm hover:bg-blue-900">Logout</button>
        </header>

        <main class="flex-1 p-4 md:p-8 max-w-6xl mx-auto w-full">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Data Customer</h2>
                <button onclick="toggleModal(true)" class="bg-green-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-green-700">+ Tambah Data</button>
            </div>

            <!-- Tabel -->
            <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200 text-sm text-gray-600">
                                <th class="p-4 font-semibold">Perusahaan / Alamat</th>
                                <th class="p-4 font-semibold">Kontak Utama</th>
                                <th class="p-4 font-semibold">Status</th>
                            </tr>
                        </thead>
                        <tbody id="customer-table-body" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL TAMBAH DATA (Pop-up) -->
    <div id="add-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6">
            <h3 class="text-xl font-bold mb-4">Tambah Customer Baru</h3>
            <div class="space-y-4">
                <input type="text" id="input-perusahaan" placeholder="Nama Perusahaan" class="w-full border p-2 rounded">
                <input type="text" id="input-nama" placeholder="Nama Kontak Utama" class="w-full border p-2 rounded">
                <input type="text" id="input-telepon" placeholder="No. Telepon / WA" class="w-full border p-2 rounded">
                <textarea id="input-alamat" placeholder="Alamat Lengkap" class="w-full border p-2 rounded"></textarea>
            </div>
            <div class="mt-6 flex justify-end space-x-3">
                <button onclick="toggleModal(false)" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Batal</button>
                <button onclick="saveCustomer()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Simpan Data</button>
            </div>
        </div>
    </div>

    <script>
        function handleLogin() {
            const pin = document.getElementById('pin-input').value;
            if (pin.length > 3) { 
                sessionStorage.setItem('app_pin', pin); 
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('dashboard-view').classList.remove('hidden');
                document.getElementById('dashboard-view').classList.add('flex');
                fetchCustomers();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function handleLogout() {
            sessionStorage.removeItem('app_pin');
            location.reload();
        }

        function toggleModal(show) {
            document.getElementById('add-modal').classList.toggle('hidden', !show);
            if(!show) {
                document.getElementById('input-perusahaan').value = '';
                document.getElementById('input-nama').value = '';
                document.getElementById('input-telepon').value = '';
                document.getElementById('input-alamat').value = '';
            }
        }

        async function fetchCustomers() {
            const tbody = document.getElementById('customer-table-body');
            tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center">Memuat...</td></tr>';
            try {
                const res = await fetch('/api/customers');
                const data = await res.json();
                
                if(data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-gray-500">Belum ada data customer.</td></tr>';
                    return;
                }
                
                tbody.innerHTML = data.map(c => `
                    <tr class="hover:bg-blue-50">
                        <td class="p-4"><b>${c.perusahaan || '-'}</b><br><span class="text-sm text-gray-500">${c.alamat || '-'}</span></td>
                        <td class="p-4">${c.nama_customer || '-'}<br><span class="text-sm text-gray-500">${c.no_telepon || '-'}</span></td>
                        <td class="p-4"><span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full">${c.status_kerjasama || 'Aktif'}</span></td>
                    </tr>
                `).join('');
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-red-500">Error jaringan.</td></tr>';
            }
        }

        async function saveCustomer() {
            const btn = event.target;
            btn.innerText = 'Menyimpan...';
            btn.disabled = true;

            const payload = {
                perusahaan: document.getElementById('input-perusahaan').value,
                nama_customer: document.getElementById('input-nama').value,
                no_telepon: document.getElementById('input-telepon').value,
                alamat: document.getElementById('input-alamat').value
            };

            try {
                const res = await fetch('/api/customers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if(res.ok) {
                    toggleModal(false);
                    fetchCustomers();
                } else {
                    alert("Gagal menyimpan data ke database.");
                }
            } catch (err) {
                alert("Kesalahan jaringan.");
            } finally {
                btn.innerText = 'Simpan Data';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
