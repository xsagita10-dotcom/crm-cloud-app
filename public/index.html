<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud CRM & Document Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <div id="login-view" class="min-h-screen flex items-center justify-center bg-gray-100">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm text-center">
            <h2 class="text-2xl font-bold mb-6 text-blue-600">Login CRM</h2>
            <input type="password" id="pin-input" placeholder="Masukkan PIN" class="w-full px-4 py-3 border rounded-lg mb-4 text-center focus:outline-none">
            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700">Masuk</button>
            <p id="login-error" class="text-red-500 text-sm mt-4 hidden">PIN salah!</p>
        </div>
    </div>

    <div id="dashboard-view" class="hidden min-h-screen flex-col">
        <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md">
            <h1 class="text-xl font-bold">Cloud CRM Dashboard</h1>
            <button onclick="handleLogout()" class="bg-red-500 px-4 py-2 rounded text-sm hover:bg-red-600 font-medium">Logout</button>
        </header>

        <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Data Customer & Proyek</h2>
                <button onclick="toggleModal(true, 'add-modal')" class="bg-green-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-green-700">+ Tambah Data</button>
            </div>
            <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-max">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200 text-sm text-gray-600">
                                <th class="p-4 font-semibold">Perusahaan & Alamat</th>
                                <th class="p-4 font-semibold">Kontak & Posisi</th>
                                <th class="p-4 font-semibold">Projek & Status</th>
                                <th class="p-4 font-semibold">Dibawa Oleh</th>
                                <th class="p-4 font-semibold">Status</th>
                            </tr>
                        </thead>
                        <tbody id="customer-table-body" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL TAMBAH CUSTOMER -->
    <div id="add-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-lg p-6 my-8">
            <h3 class="text-xl font-bold mb-4 border-b pb-2">Tambah Data Baru</h3>
            <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                <p class="font-semibold text-sm text-gray-500 uppercase">Informasi Klien</p>
                <input type="text" id="input-perusahaan" placeholder="Nama Perusahaan" class="w-full border p-2 rounded">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="input-nama" placeholder="Nama Kontak Utama" class="w-full border p-2 rounded">
                    <input type="text" id="input-posisi" placeholder="Posisi / Jabatan" class="w-full border p-2 rounded">
                </div>
                <input type="text" id="input-telepon" placeholder="No. Telepon / WA" class="w-full border p-2 rounded">
                <textarea id="input-alamat" placeholder="Alamat Lengkap" class="w-full border p-2 rounded text-sm"></textarea>
                <p class="font-semibold text-sm text-gray-500 uppercase mt-4">Informasi Proyek</p>
                <input type="text" id="input-projek" placeholder="Nama Projek" class="w-full border p-2 rounded">
                <input type="text" id="input-status-projek" placeholder="Status Projek" class="w-full border p-2 rounded">
                <input type="text" id="input-dibawa-oleh" placeholder="Dibawa Oleh" class="w-full border p-2 rounded">
            </div>
            <div class="mt-6 flex justify-end space-x-3 pt-4 border-t">
                <button onclick="toggleModal(false, 'add-modal')" class="px-4 py-2 text-gray-600 bg-gray-100 rounded font-medium">Batal</button>
                <button onclick="saveCustomer(event)" class="px-4 py-2 bg-blue-600 text-white rounded font-medium">Simpan Data</button>
            </div>
        </div>
    </div>

    <!-- MODAL DETAIL PROJECT & MEETING -->
    <div id="project-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="p-4 border-b flex justify-between items-center bg-blue-50">
                <h3 class="text-xl font-bold text-blue-800" id="project-title">Detail Proyek</h3>
                <button onclick="toggleModal(false, 'project-modal')" class="text-gray-500 hover:text-red-500 font-bold text-xl">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 flex flex-col md:flex-row gap-6">
                <!-- Kalender & Form Input -->
                <div class="w-full md:w-1/3 bg-gray-50 p-4 border rounded shadow-inner">
                    <h4 class="font-bold mb-4 text-blue-700">📅 Jadwal & Progress</h4>
                    <input type="date" id="meet-tanggal" class="w-full border p-2 mb-3 rounded text-sm bg-white">
                    <input type="text" id="meet-judul" placeholder="Cth: Meeting Awal / Survey" class="w-full border p-2 mb-3 rounded text-sm bg-white">
                    <textarea id="meet-mom" placeholder="Catatan Minutes of Meeting (MoM)..." class="w-full border p-2 mb-3 rounded text-sm h-24 bg-white"></textarea>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Unggah Foto Progress (Opsional)</label>
                    <input type="file" id="meet-foto" accept="image/*" class="w-full border p-2 mb-4 rounded text-sm bg-white">
                    <button onclick="saveMeeting(event)" class="w-full bg-blue-600 text-white font-bold p-2 rounded hover:bg-blue-700">Simpan Progress</button>
                </div>
                <!-- Timeline Riwayat -->
                <div class="w-full md:w-2/3">
                    <h4 class="font-bold mb-4 border-b pb-2">Riwayat Meeting & Dokumen</h4>
                    <div id="meeting-list" class="space-y-4"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentProject = "";

        window.onload = function() {
            if (sessionStorage.getItem('app_pin')) {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('dashboard-view').classList.remove('hidden');
                document.getElementById('dashboard-view').classList.add('flex');
                fetchCustomers();
            }
        };

        function handleLogin() {
            const pin = document.getElementById('pin-input').value;
            if (pin.length >= 4) { 
                sessionStorage.setItem('app_pin', pin); 
                location.reload();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }
        function handleLogout() { sessionStorage.removeItem('app_pin'); location.reload(); }
        
        function toggleModal(show, modalId) {
            document.getElementById(modalId).classList.toggle('hidden', !show);
        }

        async function fetchCustomers() {
            const tbody = document.getElementById('customer-table-body');
            tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center">Memuat data...</td></tr>';
            try {
                const res = await fetch('/api/customers');
                const data = await res.json();
                tbody.innerHTML = data.map(c => `
                    <tr class="hover:bg-blue-50 border-b border-gray-100">
                        <td class="p-4 align-top"><b>${c.perusahaan || '-'}</b><br><span class="text-xs text-gray-500">${c.alamat || '-'}</span></td>
                        <td class="p-4 align-top"><b>${c.nama_customer || '-'}</b><br><span class="text-xs text-gray-600">${c.posisi || '-'}</span><br><span class="text-xs text-gray-500">${c.no_telepon || '-'}</span></td>
                        <td class="p-4 align-top">
                            ${c.nama_projek ? `<button onclick="openProject('${c.nama_projek}')" class="font-bold text-blue-600 hover:underline cursor-pointer text-left">${c.nama_projek}</button>` : '-'}
                            <br><span class="text-xs px-2 py-0.5 bg-blue-100 text-blue-800 rounded-full inline-block mt-1">${c.status_projek || '-'}</span>
                        </td>
                        <td class="p-4 align-top text-sm text-gray-700">${c.dibawa_oleh || '-'}</td>
                        <td class="p-4 align-top"><span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full">${c.status_kerjasama || 'Aktif'}</span></td>
                    </tr>
                `).join('');
            } catch (err) { tbody.innerHTML = '<tr><td colspan="5" class="text-red-500 p-4">Gagal memuat.</td></tr>'; }
        }

        async function saveCustomer(e) {
            e.target.disabled = true;
            const payload = {
                perusahaan: document.getElementById('input-perusahaan').value, nama_customer: document.getElementById('input-nama').value,
                posisi: document.getElementById('input-posisi').value, no_telepon: document.getElementById('input-telepon').value,
                alamat: document.getElementById('input-alamat').value, nama_projek: document.getElementById('input-projek').value,
                status_projek: document.getElementById('input-status-projek').value, dibawa_oleh: document.getElementById('input-dibawa-oleh').value
            };
            await fetch('/api/customers', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            toggleModal(false, 'add-modal');
            fetchCustomers();
            e.target.disabled = false;
        }

        function openProject(projek) {
            currentProject = projek;
            document.getElementById('project-title').innerText = "Proyek: " + projek;
            toggleModal(true, 'project-modal');
            fetchMeetings();
        }

        async function fetchMeetings() {
            const list = document.getElementById('meeting-list');
            list.innerHTML = '<p class="text-sm text-gray-500">Memuat riwayat...</p>';
            try {
                const res = await fetch('/api/meetings?projek=' + encodeURIComponent(currentProject));
                const data = await res.json();
                if(data.length === 0) { list.innerHTML = '<p class="text-sm text-gray-500">Belum ada progress di proyek ini.</p>'; return; }
                list.innerHTML = data.map(m => `
                    <div class="border border-gray-200 p-4 rounded-lg bg-white shadow-sm">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold text-gray-800">${m.judul}</span>
                            <span class="text-xs bg-blue-100 text-blue-800 font-bold px-2 py-1 rounded">${m.tanggal}</span>
                        </div>
                        <p class="text-sm text-gray-700 whitespace-pre-wrap mt-2">${m.mom}</p>
                        ${m.foto_url ? `<a href="${m.foto_url}" target="_blank"><img src="${m.foto_url}" class="mt-3 rounded border max-h-48 hover:opacity-80 transition-opacity"></a>` : ''}
                    </div>
                `).join('');
            } catch (e) { list.innerHTML = '<p class="text-red-500">Error.</p>'; }
        }

        async function saveMeeting(e) {
            const btn = e.target; btn.innerText = "Upload..."; btn.disabled = true;
            const formData = new FormData();
            formData.append('nama_projek', currentProject);
            formData.append('tanggal', document.getElementById('meet-tanggal').value);
            formData.append('judul', document.getElementById('meet-judul').value);
            formData.append('mom', document.getElementById('meet-mom').value);
            
            const foto = document.getElementById('meet-foto').files[0];
            if(foto) formData.append('foto', foto);

            try {
                const res = await fetch('/api/meetings', { method: 'POST', body: formData });
                if(res.ok) {
                    document.getElementById('meet-judul').value = ''; document.getElementById('meet-mom').value = ''; document.getElementById('meet-foto').value = '';
                    fetchMeetings();
                } else alert("Gagal menyimpan data meeting.");
            } catch(err) { alert("Error jaringan."); }
            btn.innerText = "Simpan Progress"; btn.disabled = false;
        }
    </script>
</body>
</html>
