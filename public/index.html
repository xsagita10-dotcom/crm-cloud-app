<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud CRM & Document Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <!-- 1. LAYAR LOGIN PIN -->
    <div id="login-view" class="min-h-screen flex items-center justify-center bg-gray-100">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm text-center">
            <h2 class="text-2xl font-bold mb-6 text-blue-600">Login CRM</h2>
            <input type="password" id="pin-input" placeholder="Masukkan PIN Akses" 
                   class="w-full px-4 py-3 border rounded-lg mb-4 text-center text-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="handleLogin()" 
                    class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">
                Masuk
            </button>
            <p id="login-error" class="text-red-500 text-sm mt-4 hidden">PIN minimal 4 karakter!</p>
        </div>
    </div>

    <!-- 2. LAYAR DASHBOARD (Tersembunyi di awal) -->
    <div id="dashboard-view" class="hidden min-h-screen flex-col">
        <!-- Header -->
        <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
            <h1 class="text-xl font-bold">Cloud CRM Dashboard</h1>
            <button onclick="handleLogout()" class="bg-blue-800 px-4 py-2 rounded text-sm hover:bg-blue-900">Logout</button>
        </header>

        <!-- Konten Utama -->
        <main class="flex-1 p-4 md:p-8 max-w-6xl mx-auto w-full">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Data Customer</h2>
                <button class="bg-green-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-green-700">
                    + Tambah Data
                </button>
            </div>

            <!-- Tabel Customer -->
            <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200 text-sm text-gray-600">
                                <th class="p-4 font-semibold">Perusahaan / Alamat</th>
                                <th class="p-4 font-semibold">Kontak Utama</th>
                                <th class="p-4 font-semibold">Status</th>
                                <th class="p-4 font-semibold text-center">Dokumen</th>
                                <th class="p-4 font-semibold text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="customer-table-body" class="divide-y divide-gray-100">
                            <!-- Data akan diisi oleh JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 3. SCRIPT LOGIKA -->
    <script>
        // Fungsi Login & Navigasi
        function handleLogin() {
            const pin = document.getElementById('pin-input').value;
            if (pin.length > 3) { 
                sessionStorage.setItem('app_pin', pin); 
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('dashboard-view').classList.remove('hidden');
                document.getElementById('dashboard-view').classList.add('flex');
                
                fetchCustomers();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function handleLogout() {
            sessionStorage.removeItem('app_pin');
            document.getElementById('pin-input').value = '';
            document.getElementById('login-view').classList.remove('hidden');
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('flex');
        }

        // Fungsi Mengambil Data dari API Flask
        async function fetchCustomers() {
            const tableBody = document.getElementById('customer-table-body');
            tableBody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-500">Memuat data...</td></tr>';
            
            try {
                const response = await fetch('/api/customers');
                const data = await response.json();
                
                if (response.ok) {
                    renderTable(data);
                } else {
                    tableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">Gagal memuat data: ${data.error}</td></tr>`;
                }
            } catch (error) {
                tableBody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-red-500">Terjadi kesalahan jaringan.</td></tr>';
            }
        }

        // Fungsi Menampilkan Data ke Tabel
        function renderTable(customers) {
            const tableBody = document.getElementById('customer-table-body');
            tableBody.innerHTML = ''; 
            
            if (customers.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-500">Belum ada data customer.</td></tr>';
                return;
            }

            customers.forEach(cust => {
                const statusColor = cust.status_kerjasama === 'Aktif' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800';
                
                const rowHtml = `
                    <tr class="hover:bg-blue-50 cursor-pointer transition-colors group">
                        <td class="p-4">
                            <div class="font-bold text-gray-900">${cust.perusahaan || '-'}</div>
                            <div class="text-sm text-gray-500">${cust.alamat || '-'}</div>
                        </td>
                        <td class="p-4">
                            <div class="font-medium">${cust.nama_customer || '-'}</div>
                            <div class="text-sm text-gray-500">${cust.no_telepon || '-'}</div>
                        </td>
                        <td class="p-4">
                            <span class="${statusColor} text-xs font-bold px-2 py-1 rounded-full">${cust.status_kerjasama || 'Unknown'}</span>
                        </td>
                        <td class="p-4 text-center">
                            <span class="bg-gray-100 text-gray-700 text-xs font-bold px-2 py-1 rounded">Cek Dokumen</span>
                        </td>
                        <td class="p-4 text-right">
                            <button class="text-blue-600 hover:text-blue-800 font-medium text-sm">Lihat Detail</button>
                        </td>
                    </tr>
                `;
                tableBody.insertAdjacentHTML('beforeend', rowHtml);
            });
        }
    </script>
</body>
</html>
