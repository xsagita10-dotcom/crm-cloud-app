<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud CRM & Document Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <!-- LAYAR LOGIN PIN -->
    <div id="login-view" class="min-h-screen flex items-center justify-center bg-gray-100">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm text-center">
            <h2 class="text-2xl font-bold mb-6 text-blue-600">Login CRM</h2>
            <input type="password" id="pin-input" placeholder="Masukkan PIN" class="w-full px-4 py-3 border rounded-lg mb-4 text-center">
            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700">Masuk</button>
            <p id="login-error" class="text-red-500 text-sm mt-4 hidden">PIN salah!</p>
        </div>
    </div>

    <!-- LAYAR DASHBOARD -->
    <div id="dashboard-view" class="hidden min-h-screen flex-col">
        <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md">
            <h1 class="text-xl font-bold">Cloud CRM Dashboard</h1>
            <button onclick="handleLogout()" class="bg-red-500 px-4 py-2 rounded text-sm hover:bg-red-600 font-medium">Logout</button>
        </header>

        <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                <h2 class="text-2xl font-bold text-gray-800">Data Customer & Proyek</h2>
                <div class="flex gap-3 w-full md:w-auto">
                    <button onclick="openScheduleModal()" class="flex-1 bg-yellow-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-yellow-600 shadow-sm">📅 Buat Jadwal</button>
                    <button onclick="toggleModal(true, 'add-modal')" class="flex-1 bg-green-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-green-700 shadow-sm">+ Tambah Data</button>
                </div>
            </div>
            
            <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-max">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200 text-sm text-gray-600">
                                <th class="p-4 font-semibold">Perusahaan & Alamat</th>
                                <th class="p-4 font-semibold">Kontak & Posisi</th>
                                <th class="p-4 font-semibold">Projek & Status</th>
                                <th class="p-4 font-semibold">Dibawa Oleh</th>
                                <th class="p-4 font-semibold">Status</th>
                            </tr>
                        </thead>
                        <tbody id="customer-table-body" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL TAMBAH CUSTOMER -->
    <div id="add-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-40 overflow-y-auto">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-lg p-6 my-8">
            <h3 class="text-xl font-bold mb-4 border-b pb-2">Tambah Data Baru</h3>
            <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                <p class="font-semibold text-sm text-gray-500 uppercase">Informasi Klien</p>
                <input type="text" id="input-perusahaan" placeholder="Nama Perusahaan" class="w-full border p-2 rounded">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="input-nama" placeholder="Nama Kontak" class="w-full border p-2 rounded">
                    <input type="text" id="input-posisi" placeholder="Posisi" class="w-full border p-2 rounded">
                </div>
                <input type="text" id="input-telepon" placeholder="No. Telepon" class="w-full border p-2 rounded">
                <textarea id="input-alamat" placeholder="Alamat Lengkap" class="w-full border p-2 rounded text-sm"></textarea>
                <p class="font-semibold text-sm text-gray-500 uppercase mt-4">Informasi Proyek</p>
                <input type="text" id="input-projek" placeholder="Nama Projek" class="w-full border p-2 rounded">
                <input type="text" id="input-status-projek" placeholder="Status Projek" class="w-full border p-2 rounded">
                <input type="text" id="input-dibawa-oleh" placeholder="Dibawa Oleh" class="w-full border p-2 rounded">
            </div>
            <div class="mt-6 flex justify-end space-x-3 pt-4 border-t">
                <button onclick="toggleModal(false, 'add-modal')" class="px-4 py-2 text-gray-600 bg-gray-100 rounded font-medium">Batal</button>
                <button onclick="saveCustomer(event)" class="px-4 py-2 bg-blue-600 text-white rounded font-medium">Simpan Data</button>
            </div>
        </div>
    </div>

    <!-- MODAL BUAT JADWAL -->
    <div id="schedule-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6">
            <h3 class="text-xl font-bold mb-4 border-b pb-2 text-yellow-600">📅 Buat Jadwal Baru</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Pilih Perusahaan / Proyek</label>
                    <select id="sched-projek" class="w-full border p-2 rounded bg-gray-50"></select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Tanggal</label>
                        <input type="date" id="sched-tanggal" class="w-full border p-2 rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Jam</label>
                        <input type="time" id="sched-jam" class="w-full border p-2 rounded">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Judul / Agenda</label>
                    <input type="text" id="sched-judul" placeholder="Cth: Meeting Awal, Pitching..." class="w-full border p-2 rounded">
                </div>
            </div>
            <div class="mt-6 flex justify-end space-x-3 pt-4 border-t">
                <button onclick="toggleModal(false, 'schedule-modal')" class="px-4 py-2 text-gray-600 bg-gray-100 rounded font-medium">Batal</button>
                <button onclick="saveSchedule(event)" class="px-4 py-2 bg-yellow-500 text-white rounded font-bold hover:bg-yellow-600">Jadwalkan</button>
            </div>
        </div>
    </div>

    <!-- MODAL DETAIL PROJECT & DAFTAR PROGRESS -->
    <div id="project-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-40">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-4xl max-h-[95vh] flex flex-col overflow-hidden">
            <div class="p-4 border-b flex justify-between items-center bg-blue-50">
                <h3 class="text-xl font-bold text-blue-800" id="project-title">Detail Proyek</h3>
                <button onclick="toggleModal(false, 'project-modal')" class="text-gray-500 hover:text-red-500 font-bold text-2xl">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 bg-gray-50">
                <div class="flex justify-between items-center mb-4 border-b border-gray-300 pb-2">
                    <h4 class="font-bold text-gray-800">Timeline & Riwayat Proyek</h4>
                    <!-- TOMBOL BARU: TAMBAH PROGRESS LANGSUNG DARI DALAM -->
                    <button onclick="openAddProgress()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm font-bold hover:bg-blue-700 shadow">+ Tambah Progress</button>
                </div>
                <div id="meeting-list" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <!-- MODAL FORM PROGRESS (DIPAKAI UNTUK EDIT & TAMBAH BARU) -->
    <div id="meeting-detail-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-xl max-h-[95vh] flex flex-col overflow-hidden border-t-8 border-blue-500">
            <div class="p-5 border-b flex justify-between items-center bg-gray-50">
                <h3 class="text-xl font-bold text-gray-800" id="modal-progress-title">Perbarui Progress</h3>
                <button onclick="toggleModal(false, 'meeting-detail-modal')" class="text-gray-500 hover:text-red-500 font-bold text-2xl">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 space-y-4">
                
                <input type="hidden" id="edit-id">
                <input type="hidden" id="edit-projek">

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Tanggal</label>
                        <input type="date" id="edit-tanggal" class="w-full border p-2 rounded text-sm bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Jam</label>
                        <input type="time" id="edit-jam" class="w-full border p-2 rounded text-sm bg-gray-50">
                    </div>
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Judul / Agenda</label>
                    <input type="text" id="edit-judul" class="w-full border p-2 rounded text-sm font-bold text-blue-700">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Minutes of Meeting (MoM) / Laporan</label>
                    <textarea id="edit-mom" placeholder="Ketik hasil meeting atau laporan progress di sini..." class="w-full border p-3 rounded text-sm h-32 leading-relaxed focus:ring-2 focus:ring-blue-200"></textarea>
                </div>
                
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                    <label class="block text-sm font-bold text-blue-800 mb-2">Unggah Foto Progress</label>
                    <input type="file" id="edit-foto" accept="image/*" class="w-full border p-2 rounded bg-white text-sm">
                    
                    <div id="edit-foto-container" class="mt-4 hidden flex-col items-center bg-white p-2 rounded border">
                        <span class="text-xs font-bold text-gray-500 mb-2">Foto Saat Ini:</span>
                        <a id="edit-foto-link" href="#" target="_blank">
                            <img id="edit-foto-img" src="" class="max-h-32 rounded border hover:opacity-80">
                        </a>
                    </div>
                </div>

            </div>
            <div class="p-5 border-t bg-gray-50 flex justify-end">
                <button onclick="updateMeetingData(event)" class="w-full md:w-auto px-6 py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 shadow-md">Simpan Data</button>
            </div>
        </div>
    </div>

    <script>
        let currentProject = "";
        let meetingsData = []; 
        let globalCustomers = []; 

        window.onload = function() {
            if (sessionStorage.getItem('app_pin')) {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('dashboard-view').classList.remove('hidden');
                document.getElementById('dashboard-view').classList.add('flex');
                fetchCustomers();
            }
        };

        function handleLogin() {
            const pin = document.getElementById('pin-input').value;
            if (pin.length >= 4) { 
                sessionStorage.setItem('app_pin', pin); location.reload();
            } else { document.getElementById('login-error').classList.remove('hidden'); }
        }
        function handleLogout() { sessionStorage.removeItem('app_pin'); location.reload(); }
        function toggleModal(show, modalId) { document.getElementById(modalId).classList.toggle('hidden', !show); }

        async function fetchCustomers() {
            const tbody = document.getElementById('customer-table-body');
            tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center">Memuat...</td></tr>';
            try {
                const res = await fetch('/api/customers');
                globalCustomers = await res.json();
                
                tbody.innerHTML = globalCustomers.map(c => `
                    <tr class="hover:bg-blue-50 border-b border-gray-100">
                        <td class="p-4 align-top"><b>${c.perusahaan || '-'}</b><br><span class="text-xs text-gray-500">${c.alamat || '-'}</span></td>
                        <td class="p-4 align-top"><b>${c.nama_customer || '-'}</b><br><span class="text-xs text-gray-600">${c.posisi || '-'}</span><br><span class="text-xs text-gray-500">${c.no_telepon || '-'}</span></td>
                        <td class="p-4 align-top">
                            ${c.nama_projek ? `<button onclick="openProject('${c.nama_projek}')" class="font-bold text-blue-600 hover:underline text-left">${c.nama_projek}</button>` : '-'}
                            <br><span class="text-xs px-2 py-0.5 bg-blue-100 text-blue-800 rounded-full mt-1">${c.status_projek || '-'}</span>
                        </td>
                        <td class="p-4 align-top text-sm">${c.dibawa_oleh || '-'}</td>
                        <td class="p-4 align-top"><span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full">${c.status_kerjasama || 'Aktif'}</span></td>
                    </tr>
                `).join('');
            } catch (err) { tbody.innerHTML = '<tr><td colspan="5" class="text-red-500">Error</td></tr>'; }
        }

        async function saveCustomer(e) {
            e.target.disabled = true;
            const payload = {
                perusahaan: document.getElementById('input-perusahaan').value, nama_customer: document.getElementById('input-nama').value,
                posisi: document.getElementById('input-posisi').value, no_telepon: document.getElementById('input-telepon').value,
                alamat: document.getElementById('input-alamat').value, nama_projek: document.getElementById('input-projek').value,
                status_projek: document.getElementById('input-status-projek').value, dibawa_oleh: document.getElementById('input-dibawa-oleh').value
            };
            await fetch('/api/customers', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            toggleModal(false, 'add-modal'); fetchCustomers(); e.target.disabled = false;
        }

        // ==========================================
        // FUNGSI BUAT JADWAL DARI LUAR
        // ==========================================
        function openScheduleModal() {
            const select = document.getElementById('sched-projek');
            const projects = globalCustomers.filter(c => c.nama_projek && c.nama_projek.trim() !== "");
            if (projects.length === 0) {
                alert("Belum ada proyek terdaftar."); return;
            }
            select.innerHTML = projects.map(c => `<option value="${c.nama_projek}">${c.perusahaan} - ${c.nama_projek}</option>`).join('');
            document.getElementById('sched-tanggal').value = ''; document.getElementById('sched-jam').value = ''; document.getElementById('sched-judul').value = '';
            toggleModal(true, 'schedule-modal');
        }

        async function saveSchedule(e) {
            const btn = e.target; btn.innerText = "Menyimpan..."; btn.disabled = true;
            const formData = new FormData();
            formData.append('nama_projek', document.getElementById('sched-projek').value);
            formData.append('tanggal', document.getElementById('sched-tanggal').value || '');
            formData.append('jam', document.getElementById('sched-jam').value || '');
            formData.append('judul', document.getElementById('sched-judul').value || 'Meeting Baru');
            formData.append('mom', ''); 

            try {
                const res = await fetch('/api/meetings', { method: 'POST', body: formData });
                if(res.ok) { toggleModal(false, 'schedule-modal'); alert("Jadwal dibuat!"); } 
                else alert("Gagal.");
            } catch(err) { alert("Error jaringan."); }
            btn.innerText = "Jadwalkan"; btn.disabled = false;
        }

        // ==========================================
        // FUNGSI LIHAT & UPDATE PROGRESS 
        // ==========================================
        function openProject(projek) {
            currentProject = projek;
            document.getElementById('project-title').innerText = "Proyek: " + projek;
            toggleModal(true, 'project-modal');
            fetchMeetings();
        }

        async function fetchMeetings() {
            const list = document.getElementById('meeting-list');
            list.innerHTML = '<p class="text-sm text-center">Memuat riwayat...</p>';
            try {
                const res = await fetch('/api/meetings?projek=' + encodeURIComponent(currentProject));
                meetingsData = await res.json();
                if(meetingsData.length === 0) { list.innerHTML = '<div class="text-center p-4 text-gray-500">Belum ada progress.</div>'; return; }
                
                list.innerHTML = meetingsData.map((m, idx) => `
                    <div class="border border-gray-200 p-4 rounded-xl bg-white shadow-sm mb-3">
                        <div class="flex justify-between items-start mb-2">
                            <span class="font-bold text-gray-800 text-lg">${m.judul}</span>
                            <div class="text-right ml-4 shrink-0">
                                <span class="block text-xs bg-blue-100 text-blue-800 font-bold px-2 py-1 rounded">${m.tanggal || '-'}</span>
                                <span class="block text-xs text-gray-500 mt-1">🕒 ${m.jam || '-'}</span>
                            </div>
                        </div>
                        <p class="text-sm text-gray-600 mb-3 whitespace-pre-wrap">${m.mom || 'Belum ada catatan...'}</p>
                        
                        <!-- Thumbnail Foto (Klik untuk melihat ukuran asli) -->
                        ${m.foto_url ? `
                            <div class="mb-4">
                                <a href="${m.foto_url}" target="_blank" title="Klik untuk memperbesar">
                                    <img src="${m.foto_url}" class="h-24 w-auto object-cover rounded-lg border shadow-sm hover:opacity-80 transition-opacity">
                                </a>
                            </div>
                        ` : ''}

                        <div class="flex justify-end border-t pt-3">
                            <button onclick="openEditMeeting(${idx})" class="bg-gray-800 text-white text-xs px-4 py-2 rounded font-bold hover:bg-black transition-colors">✏️ Edit Data</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) { list.innerHTML = '<p class="text-red-500">Error.</p>'; }
        }

        // Fungsi Tombol "Tambah Progress" di dalam Jendela Proyek
        function openAddProgress() {
            document.getElementById('modal-progress-title').innerText = "Tambah Progress Baru";
            document.getElementById('edit-id').value = ""; // Dikosongkan agar jadi data baru
            document.getElementById('edit-projek').value = currentProject;
            document.getElementById('edit-tanggal').value = "";
            document.getElementById('edit-jam').value = "";
            document.getElementById('edit-judul').value = "";
            document.getElementById('edit-mom').value = "";
            document.getElementById('edit-foto').value = "";
            
            document.getElementById('edit-foto-container').classList.add('hidden');
            document.getElementById('edit-foto-container').classList.remove('flex');
            
            toggleModal(true, 'meeting-detail-modal');
        }

        function openEditMeeting(index) {
            const m = meetingsData[index];
            document.getElementById('modal-progress-title').innerText = "Perbarui Progress";
            document.getElementById('edit-id').value = m.id;
            document.getElementById('edit-projek').value = m.nama_projek;
            document.getElementById('edit-tanggal').value = m.tanggal || '';
            document.getElementById('edit-jam').value = m.jam || '';
            document.getElementById('edit-judul').value = m.judul || '';
            document.getElementById('edit-mom').value = m.mom || '';
            document.getElementById('edit-foto').value = '';
            
            const fotoContainer = document.getElementById('edit-foto-container');
            if (m.foto_url) {
                document.getElementById('edit-foto-img').src = m.foto_url;
                document.getElementById('edit-foto-link').href = m.foto_url;
                fotoContainer.classList.remove('hidden');
                fotoContainer.classList.add('flex');
            } else {
                fotoContainer.classList.add('hidden');
                fotoContainer.classList.remove('flex');
            }
            toggleModal(true, 'meeting-detail-modal');
        }

        async function updateMeetingData(e) {
            const btn = e.target; btn.innerText = "Menyimpan..."; btn.disabled = true;
            const formData = new FormData();
            
            const editId = document.getElementById('edit-id').value;
            if (editId) formData.append('id', editId); // Kirim ID hanya jika mode edit

            formData.append('nama_projek', document.getElementById('edit-projek').value);
            formData.append('tanggal', document.getElementById('edit-tanggal').value || '');
            formData.append('jam', document.getElementById('edit-jam').value || '');
            formData.append('judul', document.getElementById('edit-judul').value || '');
            formData.append('mom', document.getElementById('edit-mom').value || '');
            
            const foto = document.getElementById('edit-foto').files[0];
            if(foto) formData.append('foto', foto);

            try {
                const res = await fetch('/api/meetings', { method: 'POST', body: formData });
                if(res.ok) {
                    toggleModal(false, 'meeting-detail-modal');
                    fetchMeetings(); // Otomatis perbarui daftar
                } else alert("Gagal memperbarui data.");
            } catch(err) { alert("Error jaringan."); }
            btn.innerText = "Simpan Data"; btn.disabled = false;
        }
    </script>
</body>
</html>
