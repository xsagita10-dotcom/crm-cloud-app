<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud CRM & Document Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <div id="login-view" class="min-h-screen flex items-center justify-center bg-gray-100">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm text-center">
            <h2 class="text-2xl font-bold mb-6 text-blue-600">Login CRM</h2>
            <input type="password" id="pin-input" placeholder="Masukkan PIN" class="w-full px-4 py-3 border rounded-lg mb-4 text-center">
            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700">Masuk</button>
            <p id="login-error" class="text-red-500 text-sm mt-4 hidden">PIN salah!</p>
        </div>
    </div>

    <div id="dashboard-view" class="hidden min-h-screen flex-col">
        <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md">
            <h1 class="text-xl font-bold">Cloud CRM Dashboard</h1>
            <button onclick="handleLogout()" class="bg-red-500 px-4 py-2 rounded text-sm hover:bg-red-600 font-medium">Logout</button>
        </header>

        <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                <h2 class="text-2xl font-bold text-gray-800">Data Customer & Proyek</h2>
                <div class="flex gap-3 w-full md:w-auto">
                    <button onclick="openScheduleModal()" class="flex-1 bg-yellow-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-yellow-600 shadow-sm">📅 Buat Jadwal</button>
                    <button onclick="toggleModal(true, 'add-modal')" class="flex-1 bg-green-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-green-700 shadow-sm">+ Tambah Data</button>
                </div>
            </div>
            
            <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-max">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200 text-sm text-gray-600">
                                <th class="p-4 font-semibold">Perusahaan & Alamat</th>
                                <th class="p-4 font-semibold">Kontak & Posisi</th>
                                <th class="p-4 font-semibold">Projek & Status</th>
                                <th class="p-4 font-semibold">Dibawa Oleh</th>
                                <th class="p-4 font-semibold">Status</th>
                            </tr>
                        </thead>
                        <tbody id="customer-table-body" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL TAMBAH CUSTOMER & JADWAL AWAL -->
    <div id="add-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-40 overflow-y-auto">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-lg p-6 my-8">
            <h3 class="text-xl font-bold mb-4 border-b pb-2">Tambah Data Baru</h3>
            <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                <input type="text" id="input-perusahaan" placeholder="Nama Perusahaan" class="w-full border p-2 rounded">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="input-nama" placeholder="Nama Kontak" class="w-full border p-2 rounded">
                    <input type="text" id="input-posisi" placeholder="Posisi" class="w-full border p-2 rounded">
                </div>
                <input type="text" id="input-telepon" placeholder="No. Telepon" class="w-full border p-2 rounded">
                <textarea id="input-alamat" placeholder="Alamat Lengkap" class="w-full border p-2 rounded text-sm"></textarea>
                <input type="text" id="input-projek" placeholder="Nama Projek" class="w-full border p-2 rounded mt-4">
                <input type="text" id="input-status-projek" placeholder="Status Projek" class="w-full border p-2 rounded">
                <input type="text" id="input-dibawa-oleh" placeholder="Dibawa Oleh" class="w-full border p-2 rounded">
            </div>
            <div class="mt-6 flex justify-end space-x-3 pt-4 border-t">
                <button onclick="toggleModal(false, 'add-modal')" class="px-4 py-2 bg-gray-100 rounded font-bold text-gray-600">Batal</button>
                <button onclick="saveCustomer(event)" class="px-4 py-2 bg-blue-600 text-white rounded font-bold">Simpan Data</button>
            </div>
        </div>
    </div>

    <div id="schedule-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6">
            <h3 class="text-xl font-bold mb-4 border-b pb-2 text-yellow-600">📅 Buat Jadwal Baru</h3>
            <div class="space-y-4">
                <select id="sched-projek" class="w-full border p-2 rounded bg-gray-50"></select>
                <div class="grid grid-cols-2 gap-4">
                    <input type="date" id="sched-tanggal" class="w-full border p-2 rounded">
                    <input type="time" id="sched-jam" class="w-full border p-2 rounded">
                </div>
                <input type="text" id="sched-judul" placeholder="Cth: Meeting Awal..." class="w-full border p-2 rounded">
            </div>
            <div class="mt-6 flex justify-end space-x-3 pt-4 border-t">
                <button onclick="toggleModal(false, 'schedule-modal')" class="px-4 py-2 bg-gray-100 rounded text-gray-600 font-bold">Batal</button>
                <button onclick="saveSchedule(event)" class="px-4 py-2 bg-yellow-500 text-white rounded font-bold">Jadwalkan</button>
            </div>
        </div>
    </div>

    <!-- MODAL DETAIL PROJECT (TABS: PROGRESS & DOKUMEN) -->
    <div id="project-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-40">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-5xl max-h-[95vh] flex flex-col overflow-hidden">
            <div class="p-4 border-b flex justify-between items-center bg-blue-50">
                <h3 class="text-xl font-bold text-blue-800" id="project-title">Detail Proyek</h3>
                <button onclick="toggleModal(false, 'project-modal')" class="text-gray-500 hover:text-red-500 font-bold text-2xl">&times;</button>
            </div>
            
            <div class="flex border-b bg-gray-50">
                <button id="tab-btn-progress" onclick="switchTab('progress')" class="flex-1 py-3 font-bold border-b-2 border-blue-600 text-blue-600 bg-white transition-colors">Riwayat Progress</button>
                <button id="tab-btn-dokumen" onclick="switchTab('dokumen')" class="flex-1 py-3 font-bold border-b-2 border-transparent text-gray-500 hover:bg-gray-100 transition-colors">Dokumen Proyek</button>
            </div>

            <div class="p-6 overflow-y-auto flex-1 bg-gray-50 relative">
                <div id="tab-progress">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-300 pb-2">
                        <h4 class="font-bold text-gray-800">Timeline Meeting & Laporan</h4>
                        <button onclick="openAddProgress()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm font-bold hover:bg-blue-700 shadow">+ Tambah Progress</button>
                    </div>
                    <div id="meeting-list" class="space-y-4"></div>
                </div>

                <div id="tab-dokumen" class="hidden">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-300 pb-2">
                        <h4 class="font-bold text-gray-800">Manajemen Dokumen File</h4>
                        <button onclick="openDocModal()" class="bg-purple-600 text-white px-3 py-1.5 rounded text-sm font-bold hover:bg-purple-700 shadow">+ Upload File</button>
                    </div>
                    <div id="document-list" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL FORM PROGRESS -->
    <div id="meeting-detail-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-xl max-h-[95vh] flex flex-col overflow-hidden border-t-8 border-blue-500">
            <div class="p-5 border-b flex justify-between items-center bg-gray-50">
                <h3 class="text-xl font-bold text-gray-800" id="modal-progress-title">Perbarui Progress</h3>
                <button onclick="toggleModal(false, 'meeting-detail-modal')" class="text-gray-500 hover:text-red-500 font-bold text-2xl">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 space-y-4">
                <input type="hidden" id="edit-id"><input type="hidden" id="edit-projek">
                <div class="grid grid-cols-2 gap-4">
                    <input type="date" id="edit-tanggal" class="w-full border p-2 rounded text-sm bg-gray-50">
                    <input type="time" id="edit-jam" class="w-full border p-2 rounded text-sm bg-gray-50">
                </div>
                <input type="text" id="edit-judul" placeholder="Judul / Agenda" class="w-full border p-2 rounded text-sm font-bold text-blue-700">
                <textarea id="edit-mom" placeholder="Ketik hasil meeting atau laporan (MoM)..." class="w-full border p-3 rounded text-sm h-32"></textarea>
                
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                    <label class="block text-sm font-bold text-blue-800 mb-2">Unggah Lampiran Foto</label>
                    <input type="file" id="edit-foto" accept="image/*" class="w-full border p-2 rounded bg-white text-sm">
                </div>
            </div>
            <div class="p-5 border-t bg-gray-50 flex justify-end">
                <button onclick="updateMeetingData(event)" class="px-6 py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 shadow-md">Simpan Progress</button>
            </div>
        </div>
    </div>

    <!-- MODAL FORM DOKUMEN -->
    <div id="document-detail-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md flex flex-col overflow-hidden border-t-8 border-purple-500">
            <div class="p-5 border-b flex justify-between items-center bg-gray-50">
                <h3 class="text-xl font-bold text-gray-800" id="modal-doc-title">Upload File Dokumen</h3>
                <button onclick="toggleModal(false, 'document-detail-modal')" class="text-gray-500 hover:text-red-500 font-bold text-2xl">&times;</button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="doc-id"><input type="hidden" id="doc-url-lama">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Nama Dokumen / File</label>
                    <input type="text" id="doc-nama" placeholder="Cth: Kontrak SPK" class="w-full border p-2 rounded font-bold text-purple-700">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Kategori File</label>
                    <input type="text" id="doc-kategori" placeholder="Cth: Invoice, Perjanjian, Desain" class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Pilih File (Biarkan kosong jika hanya ubah nama)</label>
                    <input type="file" id="doc-file" class="w-full border p-2 rounded bg-gray-50 text-sm">
                </div>
            </div>
            <div class="p-5 border-t bg-gray-50 flex justify-end">
                <button onclick="saveDocument(event)" class="px-6 py-3 bg-purple-600 text-white rounded-lg font-bold hover:bg-purple-700 shadow-md">Simpan File</button>
            </div>
        </div>
    </div>

    <!-- LIGHTBOX GALERI FOTO INTERAKTIF -->
    <div id="lightbox-modal" class="hidden fixed inset-0 bg-black bg-opacity-95 z-[70] flex flex-col items-center justify-center">
        <button onclick="toggleModal(false, 'lightbox-modal')" class="absolute top-4 right-6 text-white text-5xl hover:text-gray-400">&times;</button>
        <div class="flex items-center justify-center w-full px-4 relative h-full">
            <button onclick="prevImage()" class="absolute left-4 md:left-10 text-white text-6xl hover:text-blue-400 p-4 select-none drop-shadow-lg">&lt;</button>
            <img id="lightbox-img" src="" class="max-h-[85vh] max-w-[85vw] object-contain rounded-lg shadow-2xl transition-all">
            <button onclick="nextImage()" class="absolute right-4 md:right-10 text-white text-6xl hover:text-blue-400 p-4 select-none drop-shadow-lg">&gt;</button>
        </div>
        <p id="lightbox-counter" class="absolute bottom-6 text-white font-bold bg-black bg-opacity-50 px-4 py-2 rounded-full"></p>
    </div>

    <script>
        let currentProject = "";
        let currentCustomerId = ""; 
        let globalCustomers = []; 
        let meetingsData = []; 
        let documentsData = [];
        
        let projectImages = [];
        let currentImageIndex = 0;

        window.onload = function() {
            if (sessionStorage.getItem('app_pin')) {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('dashboard-view').classList.remove('hidden');
                document.getElementById('dashboard-view').classList.add('flex');
                fetchCustomers();
            }
        };

        function handleLogin() {
            const pin = document.getElementById('pin-input').value;
            if (pin.length >= 4) { sessionStorage.setItem('app_pin', pin); location.reload(); }
            else { document.getElementById('login-error').classList.remove('hidden'); }
        }
        function handleLogout() { sessionStorage.removeItem('app_pin'); location.reload(); }
        function toggleModal(show, modalId) { document.getElementById(modalId).classList.toggle('hidden', !show); }

        async function fetchCustomers() {
            const tbody = document.getElementById('customer-table-body');
            tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center">Memuat...</td></tr>';
            try {
                const res = await fetch('/api/index.py');
                globalCustomers = await res.json();
                tbody.innerHTML = globalCustomers.map(c => `
                    <tr class="hover:bg-blue-50 border-b border-gray-100">
                        <td class="p-4 align-top"><b>${c.perusahaan || '-'}</b><br><span class="text-xs text-gray-500">${c.alamat || '-'}</span></td>
                        <td class="p-4 align-top"><b>${c.nama_customer || '-'}</b><br><span class="text-xs text-gray-500">${c.posisi || '-'}</span></td>
                        <td class="p-4 align-top">
                            ${c.nama_projek ? `<button onclick="openProject('${c.nama_projek}', '${c.id}')" class="font-bold text-blue-600 hover:text-blue-800 hover:underline text-left">${c.nama_projek}</button>` : '-'}
                            <br><span class="text-xs bg-blue-100 text-blue-800 rounded-full px-2 mt-1 inline-block">${c.status_projek || '-'}</span>
                        </td>
                        <td class="p-4 align-top text-sm">${c.dibawa_oleh || '-'}</td>
                        <td class="p-4 align-top"><span class="bg-green-100 text-green-800 text-xs px-2 rounded-full">${c.status_kerjasama || 'Aktif'}</span></td>
                    </tr>
                `).join('');
            } catch (err) { tbody.innerHTML = '<tr><td colspan="5" class="text-red-500 text-center p-4">Error Jaringan</td></tr>'; }
        }

        async function saveCustomer(e) {
            e.target.disabled = true;
            const payload = {
                perusahaan: document.getElementById('input-perusahaan').value, nama_customer: document.getElementById('input-nama').value,
                posisi: document.getElementById('input-posisi').value, no_telepon: document.getElementById('input-telepon').value,
                alamat: document.getElementById('input-alamat').value, nama_projek: document.getElementById('input-projek').value,
                status_projek: document.getElementById('input-status-projek').value, dibawa_oleh: document.getElementById('input-dibawa-oleh').value
            };
            await fetch('/api/index.py', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            toggleModal(false, 'add-modal'); fetchCustomers(); e.target.disabled = false;
        }

        function openScheduleModal() {
            const select = document.getElementById('sched-projek');
            const projects = globalCustomers.filter(c => c.nama_projek && c.nama_projek.trim() !== "");
            if (projects.length === 0) { alert("Belum ada proyek."); return; }
            select.innerHTML = projects.map(c => `<option value="${c.nama_projek}">${c.nama_projek} (${c.perusahaan})</option>`).join('');
            toggleModal(true, 'schedule-modal');
        }

        async function saveSchedule(e) {
            e.target.disabled = true;
            const formData = new FormData();
            formData.append('action', 'meeting');
            formData.append('nama_projek', document.getElementById('sched-projek').value);
            formData.append('tanggal', document.getElementById('sched-tanggal').value);
            formData.append('jam', document.getElementById('sched-jam').value);
            formData.append('judul', document.getElementById('sched-judul').value);
            formData.append('mom', ''); 
            await fetch('/api/index.py', { method: 'POST', body: formData });
            toggleModal(false, 'schedule-modal'); e.target.disabled = false;
        }

        // ==========================================
        // FITUR PROYEK: TABS & FETCH
        // ==========================================
        function openProject(projek, customerId) {
            currentProject = projek;
            currentCustomerId = customerId; // Menyimpan ID relasi untuk dokumen
            document.getElementById('project-title').innerText = "Proyek: " + projek;
            switchTab('progress'); 
            toggleModal(true, 'project-modal');
        }

        function switchTab(tabName) {
            const tabProgress = document.getElementById('tab-progress');
            const tabDokumen = document.getElementById('tab-dokumen');
            const btnProgress = document.getElementById('tab-btn-progress');
            const btnDokumen = document.getElementById('tab-btn-dokumen');

            if (tabName === 'progress') {
                tabProgress.classList.remove('hidden'); tabDokumen.classList.add('hidden');
                btnProgress.className = "flex-1 py-3 font-bold border-b-2 border-blue-600 text-blue-600 bg-white";
                btnDokumen.className = "flex-1 py-3 font-bold border-b-2 border-transparent text-gray-500 hover:bg-gray-100";
                fetchMeetings();
            } else {
                tabProgress.classList.add('hidden'); tabDokumen.classList.remove('hidden');
                btnProgress.className = "flex-1 py-3 font-bold border-b-2 border-transparent text-gray-500 hover:bg-gray-100";
                btnDokumen.className = "flex-1 py-3 font-bold border-b-2 border-purple-600 text-purple-600 bg-white";
                fetchDocuments();
            }
        }

        // --- MANAJEMEN MEETING & FOTO (LIGHTBOX) ---
        async function fetchMeetings() {
            const list = document.getElementById('meeting-list');
            list.innerHTML = '<p class="text-sm text-center">Memuat...</p>';
            try {
                const res = await fetch('/api/index.py?tipe=meeting&projek=' + encodeURIComponent(currentProject));
                meetingsData = await res.json();
                
                projectImages = meetingsData.filter(m => m.foto_url).map(m => m.foto_url);

                if(meetingsData.length === 0) { list.innerHTML = '<div class="text-center p-4 text-gray-500 border border-dashed rounded-xl">Belum ada progress.</div>'; return; }
                
                list.innerHTML = meetingsData.map((m, idx) => {
                    let imageHtml = "";
                    if (m.foto_url) {
                        const imgIndex = projectImages.indexOf(m.foto_url);
                        imageHtml = `
                            <div class="mb-4 mt-2 cursor-pointer inline-block" onclick="openLightbox(${imgIndex})" title="Klik untuk perbesar foto">
                                <img src="${m.foto_url}" class="h-28 w-auto object-cover rounded-lg border-2 border-gray-200 shadow-sm hover:border-blue-400 hover:scale-105 transition-all">
                            </div>`;
                    }
                    
                    return `
                    <div class="border p-4 rounded-xl bg-white shadow-sm mb-3">
                        <div class="flex justify-between items-start mb-2">
                            <span class="font-bold text-gray-800 text-lg">${m.judul}</span>
                            <div class="text-right text-xs text-gray-500 shrink-0 ml-4">
                                <span class="bg-blue-100 text-blue-800 font-bold px-2 py-1 rounded block">${m.tanggal || '-'}</span>
                                <span class="block mt-1">🕒 ${m.jam || '-'}</span>
                            </div>
                        </div>
                        <p class="text-sm text-gray-600 mb-2 whitespace-pre-wrap">${m.mom || ''}</p>
                        ${imageHtml}
                        <div class="flex justify-end border-t pt-3">
                            <button onclick="openEditMeeting(${idx})" class="bg-gray-100 text-gray-700 text-xs px-4 py-2 rounded font-bold hover:bg-gray-200 transition-colors">✏️ Edit</button>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) { list.innerHTML = '<p class="text-red-500">Error.</p>'; }
        }

        // FUNGSI LIGHTBOX FOTO
        function openLightbox(index) {
            currentImageIndex = index;
            updateLightboxView();
            toggleModal(true, 'lightbox-modal');
        }
        function updateLightboxView() {
            document.getElementById('lightbox-img').src = projectImages[currentImageIndex];
            document.getElementById('lightbox-counter').innerText = `Foto ${currentImageIndex + 1} dari ${projectImages.length}`;
        }
        function nextImage() {
            currentImageIndex = (currentImageIndex + 1) % projectImages.length;
            updateLightboxView();
        }
        function prevImage() {
            currentImageIndex = (currentImageIndex - 1 + projectImages.length) % projectImages.length;
            updateLightboxView();
        }

        function openAddProgress() {
            document.getElementById('modal-progress-title').innerText = "Tambah Progress Baru";
            document.getElementById('edit-id').value = ""; document.getElementById('edit-projek').value = currentProject;
            document.getElementById('edit-tanggal').value = ""; document.getElementById('edit-jam').value = "";
            document.getElementById('edit-judul').value = ""; document.getElementById('edit-mom').value = "";
            document.getElementById('edit-foto').value = "";
            toggleModal(true, 'meeting-detail-modal');
        }

        function openEditMeeting(index) {
            const m = meetingsData[index];
            document.getElementById('modal-progress-title').innerText = "Perbarui Progress";
            document.getElementById('edit-id').value = m.id; document.getElementById('edit-projek').value = m.nama_projek;
            document.getElementById('edit-tanggal').value = m.tanggal || ''; document.getElementById('edit-jam').value = m.jam || '';
            document.getElementById('edit-judul').value = m.judul || ''; document.getElementById('edit-mom').value = m.mom || '';
            document.getElementById('edit-foto').value = '';
            toggleModal(true, 'meeting-detail-modal');
        }

        async function updateMeetingData(e) {
            e.target.disabled = true;
            const formData = new FormData();
            formData.append('action', 'meeting');
            if (document.getElementById('edit-id').value) formData.append('id', document.getElementById('edit-id').value);
            formData.append('nama_projek', document.getElementById('edit-projek').value);
            formData.append('tanggal', document.getElementById('edit-tanggal').value);
            formData.append('jam', document.getElementById('edit-jam').value);
            formData.append('judul', document.getElementById('edit-judul').value);
            formData.append('mom', document.getElementById('edit-mom').value);
            const foto = document.getElementById('edit-foto').files[0];
            if(foto) formData.append('foto', foto);
            
            await fetch('/api/index.py', { method: 'POST', body: formData });
            toggleModal(false, 'meeting-detail-modal'); fetchMeetings(); e.target.disabled = false;
        }

        // --- MANAJEMEN DOKUMEN ---
        async function fetchDocuments() {
            const list = document.getElementById('document-list');
            list.innerHTML = '<p class="text-sm text-center">Memuat dokumen...</p>';
            try {
                const res = await fetch('/api/index.py?tipe=dokumen&projek=' + encodeURIComponent(currentProject) + '&customer_id=' + encodeURIComponent(currentCustomerId));
                documentsData = await res.json();
                
                if(documentsData.length === 0) { list.innerHTML = '<div class="text-center p-4 text-gray-500 border rounded-lg border-dashed">Belum ada dokumen yang diunggah.</div>'; return; }
                
                list.innerHTML = documentsData.map((d, idx) => `
                    <div class="border p-4 rounded-xl bg-white shadow-sm flex items-center justify-between hover:border-purple-300 transition-colors">
                        <div class="flex items-center gap-4 overflow-hidden">
                            <div class="text-3xl bg-purple-50 p-3 rounded-lg text-purple-600">📄</div>
                            <div class="truncate">
                                <p class="font-bold text-purple-900 truncate">${d.nama_file}</p>
                                <div class="flex gap-2 items-center mt-1">
                                    <span class="text-xs bg-gray-100 px-2 py-0.5 rounded font-medium text-gray-600">${d.kategori_file || 'Umum'}</span>
                                    <span class="text-xs text-gray-400">${d.uploaded_at ? new Date(d.uploaded_at).toLocaleDateString() : ''}</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex gap-2 shrink-0 ml-4">
                            ${d.file_url ? `<a href="${d.file_url}" target="_blank" class="bg-blue-100 text-blue-700 px-3 py-1.5 rounded font-bold text-xs hover:bg-blue-200 shadow-sm">📥 Buka / Unduh</a>` : ''}
                            <button onclick="openEditDocument(${idx})" class="bg-gray-100 text-gray-700 px-3 py-1.5 rounded font-bold text-xs hover:bg-gray-200">✏️ Edit</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) { list.innerHTML = '<p class="text-red-500">Error memuat dokumen.</p>'; }
        }

        function openDocModal() {
            document.getElementById('modal-doc-title').innerText = "Upload Dokumen Baru";
            document.getElementById('doc-id').value = ""; 
            document.getElementById('doc-url-lama').value = "";
            document.getElementById('doc-nama').value = ""; 
            document.getElementById('doc-kategori').value = ""; 
            document.getElementById('doc-file').value = "";
            toggleModal(true, 'document-detail-modal');
        }

        function openEditDocument(index) {
            const d = documentsData[index];
            document.getElementById('modal-doc-title').innerText = "Edit Dokumen";
            document.getElementById('doc-id').value = d.id; 
            document.getElementById('doc-url-lama').value = d.file_url || "";
            document.getElementById('doc-nama').value = d.nama_file; 
            document.getElementById('doc-kategori').value = d.kategori_file || ""; 
            document.getElementById('doc-file').value = "";
            toggleModal(true, 'document-detail-modal');
        }

        async function saveDocument(e) {
            e.target.disabled = true;
            const formData = new FormData();
            formData.append('action', 'dokumen');
            formData.append('customer_id', currentCustomerId); 
            formData.append('nama_projek', currentProject); 
            
            if (document.getElementById('doc-id').value) formData.append('id', document.getElementById('doc-id').value);
            formData.append('nama_file', document.getElementById('doc-nama').value);
            formData.append('kategori_file', document.getElementById('doc-kategori').value);
            formData.append('file_url_lama', document.getElementById('doc-url-lama').value);
            
            const file = document.getElementById('doc-file').files[0];
            if(file) formData.append('file', file);

            await fetch('/api/index.py', { method: 'POST', body: formData });
            toggleModal(false, 'document-detail-modal'); fetchDocuments(); e.target.disabled = false;
        }
    </script>
</body>
</html>
