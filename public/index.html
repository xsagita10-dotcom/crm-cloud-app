<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud CRM & Document Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Plugin Kalender -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <!-- LAYAR LOGIN PIN -->
    <div id="login-view" class="min-h-screen flex items-center justify-center bg-gray-100">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm text-center">
            <h2 class="text-2xl font-bold mb-6 text-blue-600">Login CRM</h2>
            <input type="password" id="pin-input" placeholder="Masukkan PIN Akses" class="w-full px-4 py-3 border rounded-lg mb-4 text-center focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700">Masuk</button>
        </div>
    </div>

    <!-- LAYAR DASHBOARD -->
    <div id="dashboard-view" class="hidden min-h-screen flex-col">
        <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md">
            <h1 class="text-xl font-bold">Cloud CRM Dashboard</h1>
            <button onclick="handleLogout()" class="bg-blue-800 px-4 py-2 rounded text-sm hover:bg-blue-900">Logout</button>
        </header>

        <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-gray-800">Manajemen Proyek</h2>
                <button onclick="toggleModal(true)" class="bg-green-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-green-700 shadow-sm">+ Tambah Data</button>
            </div>

            <!-- Tab Navigasi -->
            <div class="mb-4 border-b flex space-x-4">
                <button onclick="switchTab('tabel')" id="tab-tabel" class="py-2 px-4 border-b-2 border-blue-600 font-bold text-blue-600">Daftar Proyek</button>
                <button onclick="switchTab('kalender')" id="tab-kalender" class="py-2 px-4 text-gray-500 font-medium hover:text-blue-600">Jadwal Kalender</button>
            </div>

            <!-- Konten: Tabel Proyek -->
            <div id="tabel-view" class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200 block">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-max">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200 text-sm text-gray-600">
                                <th class="p-4 font-semibold">Perusahaan & Alamat</th>
                                <th class="p-4 font-semibold">Kontak & Posisi</th>
                                <th class="p-4 font-semibold">Projek (KLIK DETAIL)</th>
                                <th class="p-4 font-semibold">Status</th>
                            </tr>
                        </thead>
                        <tbody id="customer-table-body" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>

            <!-- Konten: Kalender -->
            <div id="kalender-view" class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 hidden">
                <div id="calendar" class="w-full h-[600px]"></div>
            </div>
        </main>
    </div>

    <!-- MODAL: TAMBAH DATA UTAMA -->
    <div id="add-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-lg p-6 my-8">
            <h3 class="text-xl font-bold mb-4 border-b pb-2">Tambah Klien Baru</h3>
            <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                <input type="text" id="input-perusahaan" placeholder="Nama Perusahaan" class="w-full border p-2 rounded">
                <input type="text" id="input-nama" placeholder="Nama Kontak Utama" class="w-full border p-2 rounded">
                <input type="text" id="input-posisi" placeholder="Posisi / Jabatan" class="w-full border p-2 rounded">
                <input type="text" id="input-telepon" placeholder="No. Telepon / WA" class="w-full border p-2 rounded">
                <textarea id="input-alamat" placeholder="Alamat Lengkap" class="w-full border p-2 rounded text-sm"></textarea>
                <input type="text" id="input-projek" placeholder="Nama Projek" class="w-full border p-2 rounded">
                <input type="text" id="input-status-projek" placeholder="Status Projek (Misal: On Progress)" class="w-full border p-2 rounded">
                <input type="text" id="input-dibawa-oleh" placeholder="Dibawa Oleh (Referral)" class="w-full border p-2 rounded">
            </div>
            <div class="mt-6 flex justify-end space-x-3">
                <button onclick="toggleModal(false)" class="
